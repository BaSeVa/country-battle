name: Сайт на GitHub Pages
on:
  push:
    branches: [main]
    paths: ['src/**', 'data/**', 'vendor/**', 'build.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Сборка
        run: python3 build.py dist && touch dist/.nojekyll
      - name: Публикация в ветку gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сайт из ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Ссылка
        run: |
          echo "### Сайт: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
